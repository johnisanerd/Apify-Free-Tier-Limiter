[project]
name = "apify-free-tier"
version = "0.1.6"
description = "Monthly free-tier usage cap for Apify Actors. Protects the Actor owner's wallet on free and loss-leader Actors; paying Apify users are never limited."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Cole" }]
keywords = ["apify", "actor", "pay-per-event", "free-tier", "usage-limit", "supabase"]

# apify >= 2.7 is the floor, set by observation rather than the changelog:
# johnvc/Scrape-Yandex runs get_charging_manager().get_pricing_info() and reads
# per_event_prices on 2.7.3 in production. The real gate is the capability probe
# in guard.py, which runs every time and turns the guard inert if the SDK cannot
# report prices, so this bound only needs to be loose enough not to block an
# Actor that would actually work.
dependencies = [
    "apify>=2.7,<5",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/johnisanerd/Apify-Free-Tier-Limiter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apify_free_tier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
