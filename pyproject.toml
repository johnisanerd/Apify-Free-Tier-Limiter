[project]
name = "apify-free-tier"
version = "0.1.2"
description = "Monthly free-tier usage cap for Apify Actors. Protects the Actor owner's wallet on free and loss-leader Actors; paying Apify users are never limited."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Cole" }]
keywords = ["apify", "actor", "pay-per-event", "free-tier", "usage-limit", "supabase"]

# apify >= 3.0 is the floor: Actor.get_charging_manager() and
# ChargingManager.get_pricing_info() arrived in 3.0.0 (2025-09-29). Actor.charge
# itself is older (2.3.0), but without the pricing API we cannot know what a
# charge costs in dollars. The runtime probe in guard.py re-checks this and goes
# inert rather than crashing if an Actor somehow installs an older SDK.
dependencies = [
    "apify>=3.0,<5",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/johnisanerd/Apify-Free-Tier-Limiter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apify_free_tier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
